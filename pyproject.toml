[project]
name = "flyrank-ai-ml-data-leakage"
version = "0.1.0"
description = "Internship-level ML workflow for SEO content performance prediction and data leakage analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1,<2.2",
    "numpy>=1.26,<1.27",
    "scikit-learn>=1.3,<1.5",
    "matplotlib>=3.6,<3.8",
    "seaborn>=0.13,<0.14",
    "jupyter>=1.0,<2.0",
    "joblib>=1.3,<1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
